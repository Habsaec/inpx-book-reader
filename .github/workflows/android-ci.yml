name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inpx-book-reader
    steps:
      - name: Checkout reader
        uses: actions/checkout@v7
        with:
          path: inpx-book-reader

      - name: Checkout INPX Library Server (sibling)
        uses: actions/checkout@v7
        with:
          repository: Habsaec/inpx-library-server
          ref: master
          path: inpx-library-server

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: inpx-book-reader/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build web assets
        run: npm run build:app

  android-debug:
    runs-on: ubuntu-latest
    needs: verify
    defaults:
      run:
        working-directory: inpx-book-reader
    steps:
      - name: Checkout reader
        uses: actions/checkout@v7
        with:
          path: inpx-book-reader

      - name: Checkout INPX Library Server (sibling)
        uses: actions/checkout@v7
        with:
          repository: Habsaec/inpx-library-server
          ref: master
          path: inpx-library-server

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: inpx-book-reader/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: |
          npm run build:app
          npx cap sync android

      - name: Assemble debug APK
        working-directory: inpx-book-reader/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: inpx-book-reader-debug
          path: inpx-book-reader/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
