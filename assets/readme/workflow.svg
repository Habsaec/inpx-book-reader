<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">From catalog to reading</title>
  <desc id="desc">Four steps: connect to server, browse catalog, download book, read offline with sync.</desc>

  <rect width="1200" height="220" rx="28" fill="#15120f"/>
  <rect x="1.5" y="1.5" width="1197" height="217" rx="27" fill="none" stroke="#d4ac5c" stroke-opacity="0.2" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <!-- step 1 -->
    <circle cx="120" cy="88" r="28" fill="#a1671b"/>
    <text x="120" y="96" text-anchor="middle" fill="#fff8ef" font-size="22" font-weight="700">1</text>
    <text x="120" y="148" text-anchor="middle" fill="#f5f1e8" font-size="20" font-weight="650">Подключить</text>
    <text x="120" y="176" text-anchor="middle" fill="#9a8e7e" font-size="16">сервер INPX</text>

    <path d="M190 88 H290" stroke="#d4ac5c" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- step 2 -->
    <circle cx="360" cy="88" r="28" fill="#a1671b"/>
    <text x="360" y="96" text-anchor="middle" fill="#fff8ef" font-size="22" font-weight="700">2</text>
    <text x="360" y="148" text-anchor="middle" fill="#f5f1e8" font-size="20" font-weight="650">Каталог</text>
    <text x="360" y="176" text-anchor="middle" fill="#9a8e7e" font-size="16">поиск и полки</text>

    <path d="M430 88 H530" stroke="#d4ac5c" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- step 3 -->
    <circle cx="600" cy="88" r="28" fill="#a1671b"/>
    <text x="600" y="96" text-anchor="middle" fill="#fff8ef" font-size="22" font-weight="700">3</text>
    <text x="600" y="148" text-anchor="middle" fill="#f5f1e8" font-size="20" font-weight="650">Скачать</text>
    <text x="600" y="176" text-anchor="middle" fill="#9a8e7e" font-size="16">FB2 / EPUB</text>

    <path d="M670 88 H770" stroke="#d4ac5c" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- step 4 -->
    <circle cx="840" cy="88" r="28" fill="#a1671b"/>
    <text x="840" y="96" text-anchor="middle" fill="#fff8ef" font-size="22" font-weight="700">4</text>
    <text x="840" y="148" text-anchor="middle" fill="#f5f1e8" font-size="20" font-weight="650">Читать</text>
    <text x="840" y="176" text-anchor="middle" fill="#9a8e7e" font-size="16">офлайн + sync</text>

    <!-- badge -->
    <rect x="980" y="62" width="160" height="52" rx="14" fill="#d4ac5c" fill-opacity="0.14" stroke="#d4ac5c" stroke-opacity="0.45"/>
    <text x="1060" y="94" text-anchor="middle" fill="#d4ac5c" font-size="16" font-weight="650">только Android</text>
  </g>
</svg>
