<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1a16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/brand/app-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>INPX Book Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function () {
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        try {
          var theme =
            localStorage.getItem('inpx_app_theme') ||
            localStorage.getItem('app_theme');
          if (theme === 'dark') dark = true;
          else if (theme === 'light' || theme === 'sepia') dark = false;
          else if (theme === 'auto') {
            var hour = new Date().getHours();
            dark = hour >= 20 || hour < 7;
          }
        } catch (e) {
          /* ignore */
        }
        var bg = dark ? '#1e1a16' : '#f5f1e8';
        var text = dark ? '#e8e0d4' : '#2e2418';
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.documentElement.style.background = bg;
        document.documentElement.style.color = text;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', bg);
        document.write(
          '<style id="boot-theme">html,body,#root{background:' +
            bg +
            ';color:' +
            text +
            '}</style>'
        );
      })();
    </script>
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
